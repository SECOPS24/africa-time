<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Africa Time</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --accent: #0f9d58;
      --border: #e3e6eb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1218;
        --card: #181d27;
        --text: #e8ecf3;
        --muted: #9aa3b2;
        --accent: #3ddc84;
        --border: #272e3b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1218;
      --card: #181d27;
      --text: #e8ecf3;
      --muted: #9aa3b2;
      --accent: #3ddc84;
      --border: #272e3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
    }
    header { max-width: 960px; margin: 0 auto 20px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .city { font-weight: 600; font-size: 1.05rem; }
    .country { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
    .time {
      font-size: 2rem;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .date { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .status { max-width: 960px; margin: 18px auto 0; color: var(--muted); font-size: 0.8rem; }
    .error { color: #d93025; }
  </style>
</head>
<body>
  <header>
    <h1>Africa Time</h1>
    <p class="sub">Current local time across African cities</p>
  </header>

  <main class="grid" id="grid">
    <div class="card">Loading…</div>
  </main>

  <p class="status" id="status"></p>

  <script>
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    function render(data) {
      grid.innerHTML = '';
      for (const c of data.cities) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="city"></div>' +
          '<div class="country"></div>' +
          '<div class="time"></div>' +
          '<div class="date"></div>';
        card.querySelector('.city').textContent = c.city;
        card.querySelector('.country').textContent = c.country;
        card.querySelector('.time').textContent = c.time;
        card.querySelector('.date').textContent = c.date;
        grid.appendChild(card);
      }
      statusEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
      statusEl.classList.remove('error');
    }

    async function load() {
      try {
        const res = await fetch('/api/times', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        render(await res.json());
      } catch (err) {
        statusEl.textContent = 'Could not load times: ' + err.message;
        statusEl.classList.add('error');
      }
    }

    load();
    setInterval(load, 1000);
  </script>
</body>
</html>
